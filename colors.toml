# Dark Knight Samurai: Ink, Obsidian, and Katana Steel.
# Monochromatic ink-wash palette tailored for the Samurai wallpaper.

mode = "dark"

# Ground: Obsidian sumi-e ink.
background               = "#09090B"
dark_background          = "#050507"
darker_background        = "#000000"
lighter_background       = "#18181B"

# Structure and text: Folded katana steel ramp.
line                     = "#27272A"
muted                    = "#80808A"
dark_foreground          = "#9898A2"
light_foreground         = "#B0B0BA"
foreground               = "#D4D4D8"
bright_foreground        = "#F4F4F5"
cursor                   = "#D4D4D8"

# The accent: Polished Katana blade edge reflection.
accent                   = "#E4E4E7"
accent_dim               = "#71717A"
active_border            = "#D4D4D8"
selection                = "#27272A"
selection_background     = "#27272A"
selection_foreground     = "#FAFAFA"

# Window borders: Katana blade specular edge fading to folded dark steel at 45deg.
hyprland_active_border   = "rgba(E4E4E7ee) rgba(3F3F46cc) 45deg"
hyprland_inactive_border = "rgba(27272Acc)"

